<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16A34A"/>
      <stop offset="1" stop-color="#128A3E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- drop shadow -->
  <rect x="58" y="46" width="500" height="700" rx="20" fill="#0F172A" opacity="0.14"/>
  <!-- spine -->
  <rect x="40" y="30" width="86" height="700" rx="20" fill="#0E6E31"/>
  <!-- front face -->
  <rect x="78" y="30" width="482" height="700" rx="20" fill="url(#face)" stroke="#D4DAE3"/>
  <!-- gloss sweep -->
  <rect x="78" y="30" width="200" height="700" rx="20" fill="url(#gloss)"/>

  <!-- top colour band -->
  <path d="M78 50 Q78 30 98 30 L540 30 Q560 30 560 50 L560 150 L78 150 Z" fill="url(#band)"/>
  <text x="300" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="3" fill="#FFFFFF">WEBROOT</text>
  <text x="300" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1" fill="#FFFFFF" opacity="0.92">Webroot Internet Security Complete</text>

  <!-- generic shield icon (no brand logo) -->
  <g transform="translate(300 205)">
    <path d="M0 -34 C18 -26 34 -22 34 -22 L34 6 C34 30 18 44 0 52 C-18 44 -34 30 -34 6 L-34 -22 C-34 -22 -18 -26 0 -34 Z" fill="#16A34A" opacity="0.16"/>
    <path d="M0 -28 C15 -21 28 -18 28 -18 L28 5 C28 25 15 37 0 44 C-15 37 -28 25 -28 5 L-28 -18 C-28 -18 -15 -21 0 -28 Z" fill="#16A34A"/>
    <path d="M-11 4 L-3 12 L13 -8" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- product name -->
  <text x="300" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#111827">Webroot Internet</text>
<text x="300" y="346" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#111827">Security Complete</text>

  <!-- variant chip -->
  <rect x="150" y="384" width="300" height="52" rx="26" fill="#D9F2E2" stroke="#16A34A" stroke-opacity="0.4"/>
  <text x="300" y="417" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">5 Devices · 1 Year</text>

  <!-- plan label -->
  <text x="300" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#6B7280">5 Devices / 1 Year</text>

  <!-- divider -->
  <rect x="150" y="500" width="300" height="2" fill="#E5E7EB"/>

  <!-- platform line -->
  <text x="300" y="542" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#374151">Windows · macOS · Android · iOS</text>
  <text x="300" y="576" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#9CA3AF">Digital download · Delivered by email</text>

  <!-- bottom strip -->
  <rect x="78" y="672" width="482" height="58" rx="0" fill="#16A34A" opacity="0.10"/>
  <text x="300" y="708" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#128A3E">GENUINE LICENSE KEY</text>
</svg>
